<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    const usuarioActivo = JSON.parse(sessionStorage.getItem("usuarioLogueado"));
    if (usuarioActivo) {
      window.location.replace("index.html");
    }
  </script>
  <title>Login</title>
</head>
<body class="relative min-h-screen flex items-center justify-center bg-black p-6">
  <div style="background-image: url('./img/11.jpg');" class="absolute inset-0 bg-cover bg-center blur-xs -z-20"></div>
    <div class="bg-white/20 px-10 py-12 sm:px-15 sm:py-18 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.2)]">
      <form id="loginForm" class="flex flex-col gap-3">
        <h2 class="text-xl pb-4 sm:text-4xl sm:pb-6 saira uppercase tracking-widest text-center text-[#031808]">Iniciar Sesión</h2>
        <div class="flex flex-col">
          <label for="correo" class="text-[13px] open-sans font-bold tracking-wide">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-white/60 text-sm">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" id="correo" placeholder="Ingrese su correo" class="w-full border-1 border-gray-200 px-[12px] py-2 open-sans text-xs rounded-xl text-white shadow-sm shadow-lime-600/20 focus:outline-none focus:border-lime-950">
          </div>
        </div>
        <div class="flex flex-col">
          <label for="contrasena" class="text-[13px] open-sans font-bold tracking-wide">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-white/60 text-sm">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="contrasena" placeholder="Ingrese su contraseña" class="w-full border-1 border-gray-200 px-[12px] py-2 open-sans text-xs rounded-xl text-white shadow-sm shadow-lime-600/20 focus:outline-none focus:border-lime-950">
          </div>
        </div>
          <p id="errorLogin" class="text-xs text-red-500 text-center"></p>
        <div class="flex justify-center p-2.5 bg-[#031808] mt-2 rounded-[30px] shadow-xl/30 transition-all duration-300 hover:bg-[#0e3e02] hover:scale-[1.02] cursor-pointer">
          <input type="submit" value="Iniciar Sesión" class="text-white open-sans font-bold tracking-[2px] text-xs lg:text-sm uppercase">
        </div>
      </form>
      <p class="text-center text-[10px] sm:text-xs text-white mt-3 open-sans">
        ¿Aún no tienes cuenta? 
        <a href="register.html" class="text-lime-950 font-bold hover:underline ml-1">Regístrate</a>
      </p>
    </div>

  <script src="auth.js"></script>
</body>
</html>
